<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Academic Management System - Login</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="card login-box">
    <h2>Student Academic Management System</h2>
    <input id="email" type="email" placeholder="Email" value="">
    <input id="password" type="password" placeholder="Password">
    <button id="loginBtn">Login</button>
    <div id="msg" class="msg"></div>
    <p class="hint">Demo: teacher@sms.com / Teacher@123<br>student1@sms.com / Student@123</p>
  </div>
  <script src="/js/app.js"></script>
  <script>
    async function doLogin() {
      try {
        const data = await api('/api/auth/login', {
          method: 'POST',
          body: JSON.stringify({ email: email.value, password: password.value })
        });
        saveSession(data);
        window.location.href = data.role === 'ROLE_TEACHER' ? '/teacher.html' : '/student.html';
      } catch (e) { showMsg('msg', e.message, false); }
    }
    loginBtn.addEventListener('click', doLogin);
    password.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
  </script>
</body>
</html>
