
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Student Management System | Login</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="login-page">
    <div class="card login-box">

        <h2>Student Portal</h2>
        <p class="login-subtitle">Student Academic Management System</p>

        <input id="email" type="email" placeholder="Email address">
        <input id="password" type="password" placeholder="Password">

        <button id="loginBtn">Sign In</button>

        <div id="msg" class="msg"></div>

        <p class="hint" style="text-align:center;margin-top:25px">
            Secure academic management portal
        </p>

    </div>
</div>

<script src="/js/app.js"></script>
<script>
async function doLogin() {
    try {
        const data = await api('/api/auth/login', {
            method: 'POST',
            body: JSON.stringify({
                email: email.value,
                password: password.value
            })
        });

        saveSession(data);

        const pages = {
            ROLE_ADMIN: '/admin.html',
            ROLE_TEACHER: '/teacher.html',
            ROLE_STUDENT: '/student.html'
        };

        window.location.href = pages[data.role] || '/index.html';

    } catch (e) {
        showMsg('msg', e.message, false);
    }
}

loginBtn.addEventListener('click', doLogin);

password.addEventListener('keydown', e => {
    if (e.key === 'Enter') doLogin();
});
</script>

</body>
</html>
